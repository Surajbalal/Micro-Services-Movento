events {
    worker_connections 1024;
}

http {

    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/s;
    limit_req_status 429;

   include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── CORS map ─────────────────────────────────────────────────────────────
    # Only allow requests from the Vite dev server
    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173" "http://localhost:5173";
        "http://127.0.0.1:5173" "http://127.0.0.1:5173";

    }
    # ──────────────────────────────────────────────────────────────────────────

    upstream user_service {
        server user:3001;
        keepalive 16;
    }

    upstream captain_service {
        server captain:3002;
        keepalive 16;
    }

    upstream ride_service {
        server ride:3003;
        keepalive 16;
    }
    upstream auth_service {
        server auth:3004;
        keepalive 16;
    }
    upstream call_service {
        server call-service:3005;
        keepalive 16;
    }
    upstream payment_service {
        server payment:3006;
        keepalive 16;
    }

    server {
        listen 3000;

        # ── Shared CORS snippet (applied inside every location) ───────────────
        # Sets headers on every response and handles OPTIONS pre-flight
        # ─────────────────────────────────────────────────────────────────────

        location /auth/ {
            limit_req zone=global_limit burst=20 nodelay;

            # CORS
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://auth_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Cookie            $http_cookie;   # forward browser cookies upstream
            proxy_pass_header Set-Cookie;                      # pass Set-Cookie back to browser
        }

        location /users/ {
            limit_req zone=global_limit burst=20 nodelay;

            # CORS
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://user_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Cookie            $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /captain/ {
            limit_req zone=global_limit burst=20 nodelay;

            # CORS
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://captain_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Cookie            $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /rides/ {
            limit_req zone=global_limit burst=20 nodelay;

            # CORS
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                    add_header 'Access-Control-Max-Age'           1728000;
                    add_header 'Content-Length' 0;
                    return 204;
            }

            proxy_pass http://ride_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Cookie            $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /call/ {
            limit_req zone=global_limit burst=20 nodelay;

            # cors
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://call_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Cookie            $http_cookie;
            proxy_pass_header Set-Cookie;
        }
        location /api/payment/ {
            limit_req zone=global_limit burst=20 nodelay;

            # cors
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://payment_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Cookie            $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /socket.io/ {
            proxy_pass http://ride_service;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

             proxy_read_timeout 120s;
             proxy_send_timeout 120s;
        }
    }
}
