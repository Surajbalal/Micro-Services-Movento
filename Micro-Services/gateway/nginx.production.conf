# ============================================================
#  PRODUCTION nginx.conf
#  Replace nginx.conf with this file when deploying.
#
#  What to change before deploying:
#   1. Replace "yourdomain.com" with your actual domain
#   2. Replace SSL certificate paths with your real cert paths
#      (e.g. from Let's Encrypt / Certbot)
#   3. If services run on separate servers/containers,
#      replace 127.0.0.1:<port> with the actual internal IPs
# ============================================================

events {
    worker_connections 4096;   # higher than dev (1024) for production traffic
}

http {

    # ── Rate limiting (tighter in production) ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global_limit:20m rate=20r/s;
    limit_req_status 429;

    include /etc/nginx/mime.types;   # Linux path — Mac was /opt/homebrew/etc/nginx/
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── CORS map — only your production domain ────────────────────────────────
    map $http_origin $cors_origin {
        default "";
        "https://yourdomain.com"     "https://yourdomain.com";
        "https://www.yourdomain.com" "https://www.yourdomain.com";
    }

    # ── Upstream services (same machine → 127.0.0.1) ─────────────────────────
    # If each service is on its own container/VM, replace 127.0.0.1 with
    # the internal IP or container hostname (e.g. "user-service:3001")
    upstream user_service {
        server 127.0.0.1:3001;
        keepalive 32;
    }
    upstream captain_service {
        server 127.0.0.1:3002;
        keepalive 32;
    }
    upstream ride_service {
        server 127.0.0.1:3003;
        keepalive 32;
    }
    upstream auth_service {
        server 127.0.0.1:3004;
        keepalive 32;
    }
    upstream socket_nodes {
        ip_hash;
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    # ── 1. HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        # Let's Encrypt / Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 2. Main HTTPS server ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        # ── SSL ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                   always;
        add_header X-Content-Type-Options    nosniff                                always;
        add_header Referrer-Policy           strict-origin-when-cross-origin        always;

        # ── Shared proxy helper macro ─────────────────────────────────────────
        # (repeated in each location — nginx doesn't have real macros)

        location /auth/ {
            limit_req zone=global_limit burst=30 nodelay;

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://auth_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection         "";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;   # ← tells Node it's HTTPS
            proxy_set_header Cookie             $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /users/ {
            limit_req zone=global_limit burst=30 nodelay;

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://user_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection         "";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Cookie             $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /captain/ {
            limit_req zone=global_limit burst=30 nodelay;

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://captain_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection         "";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Cookie             $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /rides/ {
            limit_req zone=global_limit burst=30 nodelay;

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Cookie';
                add_header 'Access-Control-Max-Age'           1728000;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://ride_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection         "";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Cookie             $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /socket.io/ {
            proxy_pass http://socket_nodes/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "Upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }
    }
}
